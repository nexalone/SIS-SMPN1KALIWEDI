<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Kartu QR Siswa — SMPN 1 Kaliwedi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--navy:#0f4c81;--ink:#1f2a36;--muted:#66788a;--line:#e3e9ef;--bg:#f4f7fa}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:18px 24px}
header h1{margin:0;font-size:20px}
#app{display:flex;gap:20px;padding:20px;flex-wrap:wrap;align-items:flex-start}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
#side{flex:1 1 340px;max-width:440px}
#main{flex:1 1 480px;display:flex;flex-direction:column;align-items:center;gap:12px}
label.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
select,#search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
#list{max-height:360px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item:hover{background:#f0f5fa}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--navy);flex:none;cursor:pointer}
.item .txt{display:flex;flex-direction:column;min-width:0}
.item .nm{font-weight:600;font-size:14px}
.item .sub{font-size:12px;color:var(--muted);margin-top:2px}
.item.selected{background:#e3eefb}
.item.previewing{box-shadow:inset 4px 0 0 #f39c12}
.selbtns{display:flex;gap:8px;margin-top:10px}
.selbtns button{flex:1;font-size:12px;padding:8px}
button.ghost{background:#eef2f6;color:var(--ink);border:1px solid var(--line)}
#count{font-size:12px;color:var(--muted);margin-top:8px}
#selChips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;max-height:110px;overflow:auto}
.chip{background:#e3eefb;border:1px solid #bcd6ef;border-radius:16px;padding:3px 8px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip b{cursor:pointer;color:#c0392b;font-weight:700}
.empty{font-size:12px;color:var(--muted)}
#previewGrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-height:560px;overflow:auto;padding:4px;width:100%}
.pv-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.pv-item canvas{border-radius:6px;box-shadow:0 2px 8px rgba(15,76,129,.2);border:2px solid transparent}
.pv-item.current canvas{border-color:#f39c12}
.pv-cap{font-size:11px;color:var(--muted);max-width:140px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-empty{color:#999;font-size:15px;padding:40px 20px;text-align:center;width:100%}
#cardMeta{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{padding:10px 14px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-size:13px;cursor:pointer}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:not-allowed}
button.alt{background:#5a6b7b}
#status{font-size:13px;color:var(--muted);min-height:20px;text-align:center;font-weight:600}
.hint{font-size:12px;color:var(--muted);text-align:center;max-width:360px}
#print-area{display:none}
@media print{
  #app,header{display:none!important}
  #print-area{display:flex!important;flex-wrap:wrap;gap:3mm}
  .print-card{width:54mm;height:86mm}
  @page{size:A4;margin:8mm}
}
</style>
</head>
<body>
<header>
  <h1>Generator Kartu QR Siswa — SMPN 1 Kaliwedi</h1>
</header>

<div id="app">
  <div id="side" class="panel">
    <label class="lbl">1. Pilih Kelas</label>
    <select id="kelasSel"></select>

    <label class="lbl">2. Centang Nama (bisa dari beberapa kelas)</label>
    <input id="search" type="text" placeholder="🔍 Cari nama / NISN…"/>
    <div id="list"></div>
    <div class="selbtns">
      <button id="btnSelAll">✓ Pilih semua di kelas ini</button>
      <button id="btnClear" class="ghost">✗ Kosongkan pilihan</button>
    </div>
    <div id="count"></div>
    <div id="selChips"></div>
  </div>

  <div id="main" class="panel">
    <div id="previewGrid"></div>
    <div id="cardMeta">Centang nama untuk melihat kartu</div>
    <div class="btns">
      <button id="btnZip" disabled>📦 Download Terpilih (ZIP)</button>
      <button id="btnPrintSel" class="alt" disabled>🖨 Cetak Terpilih (A4)</button>
      <button id="btnPng" disabled>⬇ PNG 1 kartu</button>
      <button id="btnPrintOne" class="alt" disabled>🖨 Cetak 1 kartu</button>
    </div>
    <div id="status">Memuat…</div>
    <div class="hint">Centang nama untuk memilih (bisa beda kelas). Semua yang dicentang tampil di pratinjau. Tombol “1 kartu” memakai kartu terakhir diklik (sorot oranye). Saat mencetak: A4, skala 100%.</div>
  </div>
</div>

<div id="print-area"></div>

<script>
/* ================= KONFIGURASI ================= */
const REPO_DATA = [
  'https://raw.githubusercontent.com/nexalone/SIS-SMPN1KALIWEDI/main/data-kiosk.json',
  'https://raw.githubusercontent.com/nexalone/SIS-SMPN1KALIWEDI/master/data-kiosk.json'
];
const LOGO_URLS = ['assets/logo_smp.png','assets/logo.png','assets/logo.jpg','assets/logo.webp','assets/logo.svg'];
const NAMA_SEKOLAH = 'SMP NEGERI 1 KALIWEDI';
const LABEL_JUDUL  = 'KARTU DATA SISWA';

const MMPX = 300/25.4;
const CARD_W = Math.round(54*MMPX);
const CARD_H = Math.round(86*MMPX);
const NAVY = '#0f4c81';
const THUMB_W = 140;

let students=[], classes=[], selectedKelas=null;
let selectedSet=new Set();   // index global siswa yang dicentang
let previewIdx=-1;           // siswa terakhir diklik (sorot)
let logoImg=null, busy=false, previewToken=0;

/* ================= UTIL ================= */
const $=id=>document.getElementById(id);
const setStatus=t=>{$('status').textContent=t;};
const stripLeadingZero=n=>String(n==null?'':n).trim().replace(/^0+(?=\d)/,'');
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function ensureQR(){
  if(window.qrcode&&typeof window.qrcode==='function'){setupQREncoding();return true;}
  const cdns=['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js','https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'];
  for(const u of cdns){try{await loadScript(u);if(window.qrcode&&typeof window.qrcode==='function'){setupQREncoding();return true;}}catch(e){}}
  return false;
}
function setupQREncoding(){try{if(window.qrcode.stringToBytesFuncs&&window.qrcode.stringToBytesFuncs['UTF-8'])window.qrcode.stringToBytes=window.qrcode.stringToBytesFuncs['UTF-8'];}catch(e){}}
async function ensureZip(){
  if(window.JSZip)return true;
  for(const u of ['https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js','https://unpkg.com/jszip@3.10.1/dist/jszip.min.js','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js']){
    try{await loadScript(u);if(window.JSZip)return true;}catch(e){}}
  return false;
}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function canvasToBlob(c){return new Promise(r=>c.toBlob(r,'image/png'));}
function tryImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}

/* ================= NORMALISASI DATA ================= */
function pickField(obj,keys){
  const lower={};Object.keys(obj||{}).forEach(k=>lower[k.toLowerCase()]=obj[k]);
  for(const k of keys){let v=lower[k];if(v===undefined||v===null)continue;
    if(typeof v==='object')v=v.nama||v.name||v.label||v.value||'';
    v=String(v).trim();if(v!=='')return v;}
  return '';
}
function normalize(json){
  let arr=null;
  if(Array.isArray(json))arr=json;
  else if(json&&typeof json==='object'){
    for(const k of ['siswa','data','students','peserta','records','list','items','result'])
      if(Array.isArray(json[k])){arr=json[k];break;}
    if(!arr){const temp=[];for(const [k,v] of Object.entries(json))if(Array.isArray(v))v.forEach(it=>{if(it&&typeof it==='object')temp.push({...it,_k:k});});if(temp.length)arr=temp;}
  }
  if(!arr)return [];
  return arr.map(r=>({
    nama : pickField(r,['nama','name','nama_lengkap','nama_siswa','siswa','nama_peserta']),
    nisn : pickField(r,['nisn','nisn_siswa']),
    kelas: pickField(r,['kelas','class','rombel','kelas_nama','tingkat']) || r._k || ''
  })).filter(s=>s.nama||s.nisn);
}
async function loadData(){
  const custom=new URLSearchParams(location.search).get('data');
  const urls=custom?[custom,...REPO_DATA]:REPO_DATA;
  for(const u of urls){
    try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;
      const json=await r.json();console.log('Raw JSON dari',u,json);
      students=normalize(json);console.log('Hasil parse:',students);
      const dbg=$('dbg');if(dbg)dbg.textContent=JSON.stringify({sumber:u,total:students.length,contoh:students[0]||null},null,2);
      if(students.length)return true;
    }catch(e){console.warn('Gagal memuat',u,e);}
  }
  return false;
}
async function loadLogo(){for(const u of LOGO_URLS){try{logoImg=await tryImg(u);return;}catch(e){}}}

/* ================= QR ================= */
function makeQR(text){for(let tn=1;tn<=40;tn++){try{const q=qrcode(tn,'M');q.addData(text);q.make();return q;}catch(e){continue;}}return null;}
function drawQR(ctx,text,cx,topY,box){
  const q=makeQR(text);
  if(!q){ctx.fillStyle='#c0392b';ctx.font='24px Arial';ctx.textAlign='center';ctx.fillText('QR gagal dibuat',cx,topY+box/2);return;}
  const count=q.getModuleCount(),quiet=4,total=count+quiet*2,cell=box/total;
  const ox=cx-box/2,oy=topY;
  ctx.fillStyle='#ffffff';ctx.fillRect(ox,oy,box,box);
  ctx.fillStyle='#101820';
  for(let r=0;r<count;r++)for(let c=0;c<count;c++)if(q.isDark(r,c)){
    const cc=c+quiet,rr=r+quiet;
    const x0=ox+Math.round(cc*cell),x1=ox+Math.round((cc+1)*cell);
    const y0=oy+Math.round(rr*cell),y1=oy+Math.round((rr+1)*cell);
    ctx.fillRect(x0,y0,x1-x0,y1-y0);
  }
}

/* ================= GAMBAR KARTU ================= */
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrapText(ctx,text,maxW){const words=String(text).split(/\s+/),lines=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width<=maxW||!line)line=t;else{lines.push(line);line=w;}}if(line)lines.push(line);return lines;}
function drawLabelValue(ctx,label,value,cx,cy){ctx.font='bold 26px Arial';const lw=ctx.measureText(label).width;ctx.font='26px Arial';const vw=ctx.measureText(value).width;let x=cx-(lw+vw)/2;ctx.textAlign='left';ctx.font='bold 26px Arial';ctx.fillText(label,x,cy);ctx.font='26px Arial';ctx.fillText(value,x+lw,cy);ctx.textAlign='center';}

async function renderCard(s){
  const c=document.createElement('canvas');c.width=CARD_W;c.height=CARD_H;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,CARD_W,CARD_H);
  ctx.fillStyle=NAVY;ctx.fillRect(0,0,CARD_W,16);ctx.fillRect(0,CARD_H-16,CARD_W,16);
  ctx.strokeStyle='#d5dde5';ctx.lineWidth=3;roundRect(ctx,12,24,CARD_W-24,CARD_H-48,18);ctx.stroke();
  ctx.textAlign='center';
  let y=56;
  if(logoImg){let h=140,w=logoImg.width*(140/logoImg.height);if(w>320){w=320;h=logoImg.height*(320/logoImg.width);}ctx.drawImage(logoImg,(CARD_W-w)/2,y,w,h);y+=h+14;}else y+=46;
  ctx.fillStyle=NAVY;ctx.font='bold 34px Arial';ctx.fillText(NAMA_SEKOLAH,CARD_W/2,y+26);y+=42;
  ctx.fillStyle='#66788a';ctx.font='21px Arial';ctx.fillText(LABEL_JUDUL,CARD_W/2,y+16);y+=28;
  ctx.strokeStyle='#dbe3ea';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(60,y);ctx.lineTo(CARD_W-60,y);ctx.stroke();

  const qrText=stripLeadingZero(s.nisn)||s.nama||'-';
  const QR=396,qy=y+18;
  if(await ensureQR()){drawQR(ctx,qrText,CARD_W/2,qy,QR);}
  else{ctx.fillStyle='#c0392b';ctx.font='24px Arial';ctx.textAlign='center';ctx.fillText('Pustaka QR gagal dimuat',CARD_W/2,qy+QR/2);}

  ctx.fillStyle='#101820';ctx.font='bold 32px Arial';
  let lines=wrapText(ctx,(s.nama||'—').toUpperCase(),CARD_W-110);
  if(lines.length>2){lines=lines.slice(0,2);lines[1]=lines[1].replace(/.{2}$/,'')+'…';}
  let ty=qy+QR+50+(lines.length===1?18:0);
  for(const ln of lines){ctx.fillText(ln,CARD_W/2,ty);ty+=40;}
  ctx.fillStyle='#24313f';
  drawLabelValue(ctx,'NISN : ',s.nisn||'-',CARD_W/2,ty+14);
  drawLabelValue(ctx,'Kelas : ',s.kelas||'-',CARD_W/2,ty+56);
  return c;
}
async function makeThumb(i,w){
  const full=await renderCard(students[i]);
  const h=Math.round(w*CARD_H/CARD_W);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  cv.getContext('2d').drawImage(full,0,0,w,h);
  return cv;
}
function previewMessage(msg){$('previewGrid').innerHTML='<div class="pv-empty">'+msg+'</div>';}

/* ================= UI ================= */
function buildClasses(){
  const set=new Set();students.forEach(s=>set.add(s.kelas||''));
  classes=[...set].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  classes.sort((a,b)=>(a===''?1:0)-(b===''?1:0));
}
function fillKelas(){
  const sel=$('kelasSel');sel.innerHTML='';
  if(!classes.length){const o=document.createElement('option');o.textContent='(tidak ada data)';sel.appendChild(o);return;}
  classes.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k||'(Tanpa Kelas)';sel.appendChild(o);});
}
function renderList(){
  const q=($('search').value||'').toLowerCase();
  const el=$('list');el.innerHTML='';let shown=0;
  students.forEach((s,i)=>{
    if((s.kelas||'')!==(selectedKelas||''))return;
    if(!((s.nama+' '+s.nisn).toLowerCase().includes(q)))return;
    shown++;
    const d=document.createElement('div');
    d.className='item'+(selectedSet.has(i)?' selected':'')+(i===previewIdx?' previewing':'');
    d.dataset.i=i;
    d.innerHTML=`<input type="checkbox" data-i="${i}" ${selectedSet.has(i)?'checked':''}/>
      <span class="txt"><span class="nm">${s.nama||'—'}</span><span class="sub">NISN ${s.nisn||'-'}</span></span>`;
    el.appendChild(d);
  });
  updateCountShown(shown);
}
function updateCountShown(shown){$('count').textContent=`${shown} siswa di kelas ${selectedKelas||'(Tanpa Kelas)'} • terpilih: ${selectedSet.size}`;}
function renderSelection(){
  const wrap=$('selChips');wrap.innerHTML='';
  if(!selectedSet.size){wrap.innerHTML='<span class="empty">Belum ada dipilih.</span>';return;}
  [...selectedSet].sort((a,b)=>a-b).forEach(i=>{
    const s=students[i];const chip=document.createElement('span');chip.className='chip';
    chip.innerHTML=`${s.nama||s.nisn||('siswa#'+i)} <b data-rm="${i}">×</b>`;
    wrap.appendChild(chip);
  });
}
function updateMeta(){const n=selectedSet.size;$('cardMeta').textContent=n?`${n} kartu dipilih`:'Centang nama untuk melihat kartu';}
function toggleBtns(){
  $('btnPng').disabled=previewIdx<0;
  $('btnPrintOne').disabled=previewIdx<0;
  const n=selectedSet.size;
  $('btnZip').disabled=n===0;
  $('btnPrintSel').disabled=n===0;
}
function refreshSel(){renderList();renderSelection();updateMeta();toggleBtns();renderPreviewGrid();}

async function renderPreviewGrid(){
  const my=++previewToken;
  const grid=$('previewGrid');
  const sel=selectedStudents();
  if(!sel.length){grid.innerHTML='<div class="pv-empty">Centang nama di sebelah kiri untuk melihat kartu</div>';return;}
  grid.innerHTML='';
  setStatus(`Menyiapkan pratinjau ${sel.length} kartu…`);
  for(let k=0;k<sel.length;k++){
    if(my!==previewToken)return;
    const {i,s}=sel[k];
    const wrap=document.createElement('div');
    wrap.className='pv-item'+(i===previewIdx?' current':'');
    wrap.dataset.i=i;
    try{
      const cv=await makeThumb(i,THUMB_W);
      const cap=document.createElement('div');cap.className='pv-cap';cap.textContent=s.nama||s.nisn||'';
      wrap.appendChild(cv);wrap.appendChild(cap);
    }catch(err){console.error(err);wrap.innerHTML='<div class="pv-cap">Gagal render</div>';}
    grid.appendChild(wrap);
    if(k%4===0)await new Promise(r=>setTimeout(r));
  }
  if(my===previewToken)setStatus(`✔ ${sel.length} kartu siap.`);
}

$('list').addEventListener('click',e=>{
  const item=e.target.closest('.item');if(!item)return;
  const i=+item.dataset.i;
  const cb=item.querySelector('input[type=checkbox]');
  if(e.target!==cb){cb.checked=!cb.checked;}
  if(cb.checked)selectedSet.add(i);else selectedSet.delete(i);
  item.classList.toggle('selected',cb.checked);
  $('list').querySelectorAll('.item.previewing').forEach(x=>x.classList.remove('previewing'));
  item.classList.add('previewing');
  previewIdx=i;
  updateMeta();renderSelection();updateCountShown($('list').childElementCount);toggleBtns();
  renderPreviewGrid();
});
$('search').addEventListener('input',renderList);
$('kelasSel').addEventListener('change',e=>{selectedKelas=e.target.value;renderList();});
$('btnSelAll').onclick=()=>{students.forEach((s,i)=>{if((s.kelas||'')===(selectedKelas||''))selectedSet.add(i);});refreshSel();};
$('btnClear').onclick=()=>{selectedSet.clear();previewIdx=-1;refreshSel();};
$('selChips').addEventListener('click',e=>{const rm=e.target.closest('[data-rm]');if(!rm)return;selectedSet.delete(+rm.dataset.rm);refreshSel();});

/* ================= AKSI ================= */
function fname(s,i){return(((s.nisn||String(i+1))+'_'+(s.nama||'siswa')).replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_'))+'.png';}
function selectedStudents(){return [...selectedSet].sort((a,b)=>a-b).map(i=>({i,s:students[i]}));}

$('btnPng').onclick=async()=>{if(previewIdx<0)return;saveBlob(await canvasToBlob(await renderCard(students[previewIdx])),fname(students[previewIdx],previewIdx));};
$('btnPrintOne').onclick=async()=>{if(busy||previewIdx<0)return;busy=true;await fillPrint([previewIdx]);window.print();busy=false;setStatus('Siap.');};
$('btnZip').onclick=async()=>{
  const sel=selectedStudents();if(busy||!sel.length)return;busy=true;
  if(!(await ensureZip())){setStatus('⚠ Gagal memuat JSZip.');busy=false;return;}
  try{
    const zip=new JSZip();
    for(let k=0;k<sel.length;k++){const {i,s}=sel[k];setStatus(`Membuat kartu ${k+1}/${sel.length}…`);
      zip.file(fname(s,i),await canvasToBlob(await renderCard(s)));if(k%3===0)await new Promise(r=>setTimeout(r));}
    setStatus('Mengompres ZIP…');
    saveBlob(await zip.generateAsync({type:'blob'}),'kartu-qr-terpilih.zip');
    setStatus('✔ Selesai.');
  }finally{busy=false;}
};
async function fillPrint(idxs){
  const area=$('print-area');area.innerHTML='';
  for(let k=0;k<idxs.length;k++){
    setStatus(`Menyiapkan kartu ${k+1}/${idxs.length}…`);
    const c=await renderCard(students[idxs[k]]);
    const img=document.createElement('img');img.className='print-card';img.src=c.toDataURL('image/png');
    area.appendChild(img);
    if(k%5===0)await new Promise(r=>setTimeout(r));
  }
}
$('btnPrintSel').onclick=async()=>{
  const idxs=[...selectedSet].sort((a,b)=>a-b);if(busy||!idxs.length)return;busy=true;
  await fillPrint(idxs);window.print();busy=false;setStatus('Siap.');
};

const fj=$('fileJson');if(fj)fj.onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{students=normalize(JSON.parse(await f.text()));afterLoad(true);}
  catch(err){setStatus('⚠ File JSON tidak valid.');}
};

/* ================= INIT ================= */
function afterLoad(fromFile){
  buildClasses();fillKelas();
  if(classes.length){selectedKelas=classes[0];$('kelasSel').value=selectedKelas;}
  selectedSet.clear();previewIdx=-1;
  renderList();renderSelection();updateMeta();toggleBtns();
  renderPreviewGrid();
  setStatus(`✔ ${students.length} data siswa dimuat.`);
}
