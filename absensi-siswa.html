<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Absensi QR — SMP Negeri 1 Kaliwedi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --ink:#13203A;
    --navy:#1B3B6F;
    --navy-deep:#0F2647;
    --merah:#C1272D;
    --paper:#F4F2EC;
    --panel:#FFFFFF;
    --line:#E4E0D6;
    --hijau:#1E7B4D;
    --oranye:#C6701B;
    --biru:#2563A6;
    --ungu:#6D4FA0;
    --abu:#6B7280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }

  /* ---------- Header ---------- */
  header{
    background:var(--navy-deep);
    color:#fff;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:4px solid var(--merah);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:44px;height:44px;border-radius:10px;
    background:var(--merah);
    display:flex;align-items:center;justify-content:center;
    font-family:'Outfit',sans-serif;font-weight:800;font-size:18px;
    flex-shrink:0;
    overflow:hidden;
  }
  .brand-mark img{
    width:100%;height:100%;
    object-fit:contain;
    background:#fff;
    padding:3px;
    box-sizing:border-box;
  }
  .brand h1{
    font-family:'Outfit',sans-serif;
    font-size:16px;
    font-weight:700;
    margin:0;
    letter-spacing:0.2px;
  }
  .brand p{margin:2px 0 0;font-size:12px;color:#B9C6DE;font-weight:500;}
  #clock{
    font-family:'Outfit',sans-serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:1px;
    text-align:right;
  }
  #date-label{font-size:12px;color:#B9C6DE;text-align:right;margin-top:2px;}

  /* ---------- Main layout ---------- */
  main{
    flex:1;
    display:flex;
    gap:20px;
    padding:20px;
    max-width:1100px;
    width:100%;
    margin:0 auto;
    align-items:flex-start;
  }
  @media (max-width:820px){
    main{flex-direction:column;}
  }

  .scan-card{
    flex:1.1;
    background:var(--navy-deep);
    border-radius:18px;
    padding:16px;
    position:relative;
  }
  .scan-frame{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:12px;
    overflow:hidden;
    background:#000;
  }
  #reader{width:100%;height:100%;}
  #reader video{object-fit:cover;width:100%!important;height:100%!important;}

  /* corner brackets — signature element */
  .bracket{
    position:absolute;width:34px;height:34px;
    border-color:var(--merah);
    border-style:solid;
    border-width:0;
    pointer-events:none;
    z-index:5;
  }
  .b-tl{top:14px;left:14px;border-top-width:4px;border-left-width:4px;border-top-left-radius:8px;}
  .b-tr{top:14px;right:14px;border-top-width:4px;border-right-width:4px;border-top-right-radius:8px;}
  .b-bl{bottom:14px;left:14px;border-bottom-width:4px;border-left-width:4px;border-bottom-left-radius:8px;}
  .b-br{bottom:14px;right:14px;border-bottom-width:4px;border-right-width:4px;border-bottom-right-radius:8px;}

  .scan-line{
    position:absolute;left:6%;right:6%;height:2px;
    background:linear-gradient(90deg, transparent, #FF4B4B, transparent);
    box-shadow:0 0 10px 2px rgba(255,75,75,0.7);
    top:10%;
    animation:sweep 2.2s ease-in-out infinite;
    z-index:4;
  }
  @keyframes sweep{
    0%{top:10%;}
    50%{top:88%;}
    100%{top:10%;}
  }
  .scan-hint{
    text-align:center;color:#CBD5E8;font-size:13px;margin-top:12px;font-weight:500;
  }

  .cam-toggle{
    position:absolute;
    top:14px;left:50%;
    transform:translateX(-50%);
    z-index:25;
    background:rgba(15,38,71,0.75);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12px;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(4px);
  }
  .cam-toggle:active{background:rgba(15,38,71,0.95);}

  .manual-btn{
    display:block;
    margin:12px auto 0;
    background:transparent;
    border:1px solid var(--line);
    color:var(--navy);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
  }
  .manual-btn:active{background:var(--paper);}

  /* ---------- Modal absen manual ---------- */
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(15,20,30,0.55);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .modal-overlay.open{display:flex;}
  .modal-panel{
    background:var(--panel);
    border-radius:18px;
    width:100%;
    max-width:480px;
    max-height:85vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px 12px;
    border-bottom:1px solid var(--line);
  }
  .modal-head h2{
    font-family:'Outfit',sans-serif;font-weight:700;font-size:17px;margin:0;color:var(--ink);
  }
  .modal-close{
    background:var(--line);border:none;border-radius:50%;
    width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--ink);
  }
  .modal-filters{
    display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);
  }
  .modal-filters select, .modal-filters input{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    font-family:'Inter',sans-serif;
    font-size:13px;
    background:var(--paper);
    color:var(--ink);
  }
  .manual-list{
    flex:1;
    overflow-y:auto;
    padding:8px 12px 16px;
  }
  .manual-row{
    width:100%;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
    border:none;border-bottom:1px solid var(--line);
    background:none;
    padding:14px 8px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    text-align:left;
    cursor:pointer;
  }
  .manual-row:active{background:var(--paper);}
  .manual-row.done{color:var(--abu);cursor:default;}
  .mr-name{font-weight:600;flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mr-status{
    font-family:'Outfit',sans-serif;font-weight:700;font-size:12px;
    flex-shrink:0;
  }
  .mr-btn{
    font-family:'Outfit',sans-serif;font-weight:700;
    border:none;border-radius:999px;
    color:#fff;
    cursor:pointer;
  }
  .mr-btn:disabled{opacity:0.5;}
  .mr-hadir{background:var(--hijau);}
  .mr-sakit{background:var(--biru);}
  .mr-izin{background:var(--ungu);}

  /* ---------- Konfirmasi status (setelah nama dipilih) ---------- */
  .manual-confirm{padding:18px 20px 24px;}
  .confirm-back{
    background:none;border:none;color:var(--abu);
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    padding:0 0 16px;cursor:pointer;
  }
  .confirm-info{text-align:center;margin-bottom:22px;}
  .confirm-name{
    font-family:'Outfit',sans-serif;font-weight:800;font-size:22px;
    color:var(--ink);margin:0;
  }
  .confirm-kelas{font-size:13px;color:var(--abu);margin:4px 0 0;font-weight:600;}
  .confirm-label{
    text-align:center;font-size:12px;color:var(--abu);
    text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin:0 0 12px;
  }
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions .mr-btn{
    flex:1;
    font-size:15px;
    padding:16px 8px;
  }

  /* ---------- Floating overlay di atas kamera ---------- */
  .float-layer{
    position:absolute;inset:0;
    z-index:30;
    pointer-events:none;
    overflow:visible;
  }
  .float-card{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0.7);
    opacity:0;
    text-align:center;
    min-width:220px;
  }
  .float-card.show{
    animation:floatIn 0.45s cubic-bezier(.34,1.56,.64,1) forwards, floatBob 1.8s ease-in-out 0.45s infinite, floatOut 0.4s ease-in 2.1s forwards;
  }
  @keyframes floatIn{
    0%{transform:translate(-50%,-40%) scale(0.6);opacity:0;}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  }
  @keyframes floatBob{
    0%,100%{transform:translate(-50%,-50%) scale(1) translateY(0);}
    50%{transform:translate(-50%,-50%) scale(1) translateY(-6px);}
  }
  @keyframes floatOut{
    0%{opacity:1;}
    100%{opacity:0;transform:translate(-50%,-62%) scale(0.9);}
  }
  .float-card .fc-name{
    font-family:'Outfit',sans-serif;font-weight:800;font-size:26px;margin:0;
    color:#ffffff;
    text-shadow:0 0 10px rgba(0,0,0,0.85), 0 0 22px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.9);
  }
  .float-card .fc-kelas{
    font-size:14px;margin:4px 0 8px;font-weight:700;
    color:#FFD54A;
    text-shadow:0 0 8px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.9);
  }
  .float-card .fc-status{
    font-family:'Outfit',sans-serif;font-weight:800;font-size:14px;letter-spacing:0.6px;
    text-shadow:0 0 8px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.9);
  }
  .float-card.fc-sudah .fc-status{color:var(--oranye);}

  .star{
    position:absolute;top:50%;left:50%;
    font-size:20px;
    opacity:0;
    pointer-events:none;
    animation:starBurst 0.9s ease-out forwards;
  }
  @keyframes starBurst{
    0%{transform:translate(-50%,-50%) translate(0,0) scale(0.3) rotate(0deg);opacity:1;}
    100%{transform:translate(-50%,-50%) translate(var(--sx),var(--sy)) scale(1.1) rotate(var(--srot));opacity:0;}
  }

  /* ---------- Panel riwayat absen ---------- */
  .history-card{
    flex:0.9;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    min-height:320px;
    max-height:560px;
    display:flex;
    flex-direction:column;
  }
  .history-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
    padding:0 2px;
  }
  .history-head h2{
    font-family:'Outfit',sans-serif;font-weight:700;font-size:14px;
    color:var(--ink);text-transform:uppercase;letter-spacing:0.5px;margin:0;
  }
  .history-count{
    font-family:'Outfit',sans-serif;font-weight:800;font-size:13px;
    color:var(--hijau);
  }
  #log{
    flex:1;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:14px;
  }
  .log-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .log-row:last-child{border-bottom:none;}
  .log-row .lname{font-weight:600;}
  .log-row .lmeta{color:var(--abu);}
  .log-empty{padding:40px 20px;text-align:center;color:var(--abu);font-size:13px;}
  .badge{
    display:inline-block;padding:2px 10px;border-radius:999px;
    font-size:11px;font-weight:700;color:#fff;font-family:'Outfit',sans-serif;
  }

  footer{
    text-align:center;font-size:11px;color:var(--abu);padding:14px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark" id="brandMark">
      <img src="https://raw.githubusercontent.com/nexalone/SIS-SMPN1KALIWEDI/main/assets/logo_smp.png"
           alt="Logo SMP Negeri 1 Kaliwedi"
           onerror="this.parentElement.textContent='1K'; this.parentElement.style.background='var(--merah)';">
    </div>
    <div>
      <h1>SMP NEGERI 1 KALIWEDI</h1>
      <p>Kiosk Absensi QR Siswa</p>
    </div>
  </div>
  <div>
    <div id="clock">--:--:--</div>
    <div id="date-label">-</div>
  </div>
</header>

<main>
  <section class="scan-card">
    <div class="scan-frame">
      <div id="reader"></div>
      <div class="bracket b-tl"></div>
      <div class="bracket b-tr"></div>
      <div class="bracket b-bl"></div>
      <div class="bracket b-br"></div>
      <div class="scan-line"></div>
      <div class="float-layer" id="floatLayer"></div>
      <button class="cam-toggle" id="camToggleBtn" title="Ganti kamera">🔄 Kamera Depan</button>
    </div>
    <p class="scan-hint" id="scanHint">Arahkan kartu / kode QR siswa ke kamera</p>
    <button class="manual-btn" id="manualBtn">📋 Absen Manual (tanpa QR)</button>
  </section>

  <section class="history-card">
    <div class="history-head">
      <h2>Riwayat absen hari ini</h2>
      <span class="history-count" id="historyCount">0 siswa</span>
    </div>
    <div id="log">
      <div class="log-empty">Belum ada siswa yang absen.</div>
    </div>
  </section>
</main>

<footer>Sistem Informasi Sekolah · SMP Negeri 1 Kaliwedi</footer>

<div class="modal-overlay" id="manualModal">
  <div class="modal-panel">
    <div class="modal-head">
      <h2>Absen Manual</h2>
      <button class="modal-close" id="manualClose">✕</button>
    </div>

    <div id="manualListView">
      <div class="modal-filters">
        <select id="kelasSelect">
          <option value="">Pilih kelas…</option>
        </select>
        <input type="text" id="namaSearch" placeholder="Cari nama siswa…">
      </div>
      <div class="manual-list" id="manualList">
        <div class="log-empty">Pilih kelas untuk menampilkan daftar siswa.</div>
      </div>
    </div>

    <div id="manualConfirmView" class="manual-confirm" style="display:none;">
      <button class="confirm-back" id="confirmBack">← Kembali ke daftar</button>
      <div class="confirm-info">
        <p class="confirm-name" id="confirmName"></p>
        <p class="confirm-kelas" id="confirmKelas"></p>
      </div>
      <p class="confirm-label">Pilih status kehadiran:</p>
      <div class="confirm-actions">
        <button class="mr-btn mr-hadir" id="btnHadir" data-status="HADIR">Hadir</button>
        <button class="mr-btn mr-sakit" id="btnSakit" data-status="SAKIT">Sakit</button>
        <button class="mr-btn mr-izin" id="btnIzin" data-status="IZIN">Izin</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   KONFIGURASI — sesuaikan sebelum deploy
   ========================================================= */
const CONFIG = {
  // URL Web App Apps Script — hanya dipakai untuk KIRIM absen (POST), bukan baca data lagi
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwVm8ZDBvbxBeA3DM-fiuPORMaPwybAgwDEgZz8PjsOtLHB1uAhOHukXs8wwAJYDpCL/exec",
  // Data siswa + libur dibaca dari GitHub publik (cepat, tanpa cold-start)
  DATA_JSON_URL: "https://raw.githubusercontent.com/nexalone/SIS-SMPN1KALIWEDI/main/data-kiosk.json",
  // Jam batas terlambat (format 24 jam, menit)
  BATAS_TERLAMBAT: "07:00",
  // Jeda anti double-scan untuk NISN yang sama (ms)
  DEDUP_COOLDOWN_MS: 4000,
};

let siswaMap = {};     // NISN -> {nama, kelas, lp}
let liburSet = new Set(); // tanggal libur "YYYY-MM-DD"
let lastScan = { nisn: null, time: 0 };
let logEntries = [];
let statusHariIni = {}; // NISN -> status ("HADIR"/"TERLAMBAT"/"SAKIT"/"IZIN") untuk hari ini

/* ---------- Cache "sudah absen hari ini" di kiosk ini (localStorage) ---------- */
/* Supaya siswa yang scan ulang langsung dapat jawaban TANPA nunggu server. */
function todayKey(){
  const d = new Date();
  return `absenHariIni_${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function getSudahAbsenSet(){
  try{
    const raw = localStorage.getItem(todayKey());
    return new Set(raw ? JSON.parse(raw) : []);
  }catch(err){ return new Set(); }
}
function tandaiSudahAbsen(nisn){
  const set = getSudahAbsenSet();
  set.add(nisn);
  try{ localStorage.setItem(todayKey(), JSON.stringify([...set])); }catch(err){}
}

/* ---------- Jam realtime ---------- */
function tickClock(){
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('date-label').textContent =
    now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
setInterval(tickClock, 1000);
tickClock();

/* ---------- Ambil data master siswa & libur (dari GitHub publik) ---------- */
async function loadMasterData(){
  try{
    const res = await fetch(CONFIG.DATA_JSON_URL, { cache: "no-store" });
    const data = await res.json();
    (data.siswa || []).forEach(s => { siswaMap[String(s.nisn)] = s; });
    (data.libur || []).forEach(tgl => liburSet.add(tgl));
    document.getElementById('scanHint').textContent =
      `Arahkan kartu / kode QR siswa ke kamera · ${Object.keys(siswaMap).length} siswa dimuat`;
    loadRiwayatHariIni(); // ambil siswa yang sudah absen hari ini (misal kiosk baru dibuka/refresh)
    populateKelasOptions();
  }catch(err){
    document.getElementById('scanHint').textContent =
      "Gagal memuat data siswa. Periksa koneksi / data-kiosk.json di GitHub.";
    console.error(err);
  }
}
loadMasterData();

/* ---------- Kirim absen ke server ---------- */
async function kirimAbsen(nisn, statusManual){
  const body = { action: "absen", nisn };
  if(statusManual) body.status = statusManual; // HADIR/SAKIT/IZIN dari absen manual
  const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: "POST",
    // text/plain menghindari CORS preflight pada Apps Script
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  });
  return res.json();
}

/* ---------- Render hasil scan ---------- */
function initials(nama){
  return nama.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

/* ---------- Suara "TING" (dibangkitkan langsung, tanpa file audio) ---------- */
let audioCtx = null;
function unlockAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('click', unlockAudio, { once:true });
document.addEventListener('touchstart', unlockAudio, { once:true });

function playTing(){
  unlockAudio();
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;

  // nada utama, terang & keras
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1760, t0);       // A6
  osc.frequency.exponentialRampToValueAtTime(1320, t0 + 0.18);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(1.0, t0 + 0.02);   // serangan cepat & keras
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9); // ekor panjang "ting"
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.9);

  // lapisan harmoni tipis biar berbunyi seperti bel, bukan beep datar
  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(2640, t0);
  gain2.gain.setValueAtTime(0.0001, t0);
  gain2.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
  gain2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
  osc2.connect(gain2).connect(audioCtx.destination);
  osc2.start(t0);
  osc2.stop(t0 + 0.5);
}

function playSudahAbsen(){
  unlockAudio();
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [880, 660].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0 + i*0.14);
    gain.gain.setValueAtTime(0.0001, t0 + i*0.14);
    gain.gain.exponentialRampToValueAtTime(0.5, t0 + i*0.14 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + i*0.14 + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0 + i*0.14);
    osc.stop(t0 + i*0.14 + 0.35);
  });
}

/* ---------- Taburan bintang di sekitar overlay ---------- */
function spawnStars(){
  const layer = document.getElementById('floatLayer');
  const glyphs = ['✦','★','✧','⭐'];
  const count = 14;
  for(let i = 0; i < count; i++){
    const star = document.createElement('span');
    star.className = 'star';
    star.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    const angle = (Math.PI * 2 * i / count) + (Math.random() * 0.4 - 0.2);
    const dist = 90 + Math.random() * 70;
    star.style.setProperty('--sx', `${Math.cos(angle) * dist}px`);
    star.style.setProperty('--sy', `${Math.sin(angle) * dist}px`);
    star.style.setProperty('--srot', `${Math.random() * 360 - 180}deg`);
    star.style.color = ['#FFD54A','#FFFFFF','#FFB84A'][i % 3];
    star.style.animationDelay = `${Math.random() * 0.1}s`;
    layer.appendChild(star);
    setTimeout(() => star.remove(), 1100);
  }
}

/* ---------- Overlay nama+kelas melayang di atas kamera ---------- */
function warnaStatus(status){
  if(status === 'TERLAMBAT') return 'var(--oranye)';
  if(status === 'SAKIT') return 'var(--biru)';
  if(status === 'IZIN') return 'var(--ungu)';
  return '#4ADE80'; // HADIR — teks cerah di atas kamera gelap
}
function warnaBadge(status){
  if(status === 'TERLAMBAT') return 'var(--oranye)';
  if(status === 'SAKIT') return 'var(--biru)';
  if(status === 'IZIN') return 'var(--ungu)';
  return 'var(--hijau)'; // HADIR — background badge di panel terang
}

function showFloatCard({nama, kelas, status, sudahAbsen, statusSudah}){
  const layer = document.getElementById('floatLayer');
  const old = layer.querySelector('.float-card');
  if(old) old.remove();

  const card = document.createElement('div');
  card.className = 'float-card' + (sudahAbsen ? ' fc-sudah' : '');
  const statusColor = sudahAbsen ? warnaStatus(statusSudah) : warnaStatus(status);
  const label = sudahAbsen ? `SUDAH ABSEN${statusSudah ? ' · ' + statusSudah : ''}` : status;

  card.innerHTML = `
    <p class="fc-name">${nama}</p>
    <p class="fc-kelas">Kelas ${kelas}</p>
    <span class="fc-status" style="color:${statusColor}">${label}</span>
  `;
  layer.appendChild(card);
  requestAnimationFrame(() => card.classList.add('show'));
  setTimeout(() => card.remove(), 2600);

  if(!sudahAbsen){
    playTing();
    spawnStars();
  }else{
    playSudahAbsen();
  }
}

/* ---------- Pesan sementara di bawah kamera untuk kasus gagal ---------- */
let hintTimeout = null;
function flashHint(msg){
  const hint = document.getElementById('scanHint');
  const original = hint.dataset.base || hint.textContent;
  hint.dataset.base = original;
  hint.textContent = msg;
  hint.style.color = '#FFB4B4';
  clearTimeout(hintTimeout);
  hintTimeout = setTimeout(() => {
    hint.textContent = original;
    hint.style.color = '';
  }, 2500);
}

function renderLog(){
  const logEl = document.getElementById('log');
  if(logEntries.length === 0){
    logEl.innerHTML = `<div class="log-empty">Belum ada siswa yang absen.</div>`;
  }else{
    logEl.innerHTML = logEntries.map(e => `
      <div class="log-row">
        <span class="lname">${e.nama} <span class="lmeta">· ${e.kelas}</span></span>
        <span>
          <span class="badge" style="background:${warnaBadge(e.status)}">${e.status}</span>
          <span class="lmeta" style="margin-left:8px">${e.time.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span>
        </span>
      </div>
    `).join('');
  }
  document.getElementById('historyCount').textContent = `${logEntries.length} siswa`;
}

function addLogEntry({nama, kelas, status}){
  logEntries.unshift({nama, kelas, status, time: new Date()});
  logEntries = logEntries.slice(0, 100);
  renderLog();
}

/* ---------- Muat siswa yang sudah absen hari ini (kalau kiosk baru dibuka/refresh) ---------- */
async function loadRiwayatHariIni(){
  try{
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=riwayat`);
    const data = await res.json();
    const rows = (data.riwayat || []).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    logEntries = rows.map(r => {
      const s = siswaMap[r.nisn];
      tandaiSudahAbsen(r.nisn); // sinkronkan cache lokal juga
      statusHariIni[r.nisn] = r.status;
      return {
        nama: s ? s.nama : r.nisn,
        kelas: s ? s.kelas : '-',
        status: r.status,
        time: new Date(r.timestamp)
      };
    });
    renderLog();
  }catch(err){
    console.error("Gagal memuat riwayat hari ini:", err);
  }
}

/* ---------- Proses absen (dipakai oleh scan QR maupun absen manual) ---------- */
async function prosesAbsen(nisn, statusManual){
  const siswa = siswaMap[nisn];
  if(!siswa){
    flashHint("NISN tidak terdaftar");
    return;
  }

  // cek cache lokal dulu — kalau kiosk ini sudah pernah catat absen untuk NISN ini hari ini,
  // langsung tampilkan "SUDAH ABSEN" tanpa nunggu jaringan sama sekali
  if(getSudahAbsenSet().has(nisn)){
    showFloatCard({nama:siswa.nama, kelas:siswa.kelas, sudahAbsen:true, statusSudah:statusHariIni[nisn]});
    return;
  }

  try{
    const result = await kirimAbsen(nisn, statusManual);
    if(result.status === 'DUPLIKAT'){
      tandaiSudahAbsen(nisn);
      showFloatCard({nama:siswa.nama, kelas:siswa.kelas, sudahAbsen:true, statusSudah:statusHariIni[nisn]});
      return;
    }
    if(result.status === 'LIBUR'){
      flashHint("Hari ini libur — absensi tidak dicatat");
      return;
    }
    showFloatCard({nama:siswa.nama, kelas:siswa.kelas, status:result.status});
    addLogEntry({nama:siswa.nama, kelas:siswa.kelas, status:result.status});
    tandaiSudahAbsen(nisn);
    statusHariIni[nisn] = result.status;
  }catch(err){
    flashHint("Gagal menyimpan absen — coba lagi");
    console.error(err);
  }
}

/* ---------- Handler khusus scan QR (anti double-scan cepat) ---------- */
async function onScanSuccess(decodedText){
  const nisn = decodedText.trim();
  const now = Date.now();
  if(nisn === lastScan.nisn && (now - lastScan.time) < CONFIG.DEDUP_COOLDOWN_MS) return;
  lastScan = { nisn, time: now };
  await prosesAbsen(nisn);
}

/* ---------- Absen Manual (tanpa QR): pilih kelas + daftar nama ---------- */
function populateKelasOptions(){
  const select = document.getElementById('kelasSelect');
  const existing = new Set([...select.options].map(o => o.value));
  const kelasList = [...new Set(Object.values(siswaMap).map(s => s.kelas).filter(Boolean))]
    .sort((a, b) => String(a).localeCompare(String(b)));

  kelasList.forEach(k => {
    if(existing.has(k)) return;
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = k;
    select.appendChild(opt);
  });
}

function renderManualList(){
  const kelas = document.getElementById('kelasSelect').value;
  const q = document.getElementById('namaSearch').value.trim().toLowerCase();
  const listEl = document.getElementById('manualList');

  if(!kelas){
    listEl.innerHTML = `<div class="log-empty">Pilih kelas untuk menampilkan daftar siswa.</div>`;
    return;
  }

  const sudahSet = getSudahAbsenSet();
  const daftar = Object.entries(siswaMap)
    .filter(([nisn, s]) => s.kelas === kelas && (!q || String(s.nama).toLowerCase().includes(q)))
    .sort((a, b) => String(a[1].nama).localeCompare(String(b[1].nama)));

  if(daftar.length === 0){
    listEl.innerHTML = `<div class="log-empty">Tidak ada siswa ditemukan.</div>`;
    return;
  }

  listEl.innerHTML = daftar.map(([nisn, s]) => {
    const sudah = sudahSet.has(nisn);
    if(sudah){
      const st = statusHariIni[nisn];
      return `
        <div class="manual-row done">
          <span class="mr-name">${s.nama}</span>
          <span class="mr-status" style="color:${warnaBadge(st)}">${st ? st : 'SUDAH ABSEN'}</span>
        </div>
      `;
    }
    return `
      <button class="manual-row" data-nisn="${nisn}">
        <span class="mr-name">${s.nama}</span>
        <span class="mr-status" style="color:var(--abu)">Pilih →</span>
      </button>
    `;
  }).join('');
}


function showManualListView(){
  document.getElementById('manualListView').style.display = '';
  document.getElementById('manualConfirmView').style.display = 'none';
}

function closeManualModal(){
  document.getElementById('manualModal').classList.remove('open');
}

let selectedManualNisn = null;
function showManualConfirmView(nisn){
  const s = siswaMap[nisn];
  if(!s) return;
  selectedManualNisn = nisn;
  document.getElementById('confirmName').textContent = s.nama;
  document.getElementById('confirmKelas').textContent = `Kelas ${s.kelas}`;
  document.querySelectorAll('#manualConfirmView .mr-btn').forEach(b => b.disabled = false);
  document.getElementById('manualListView').style.display = 'none';
  document.getElementById('manualConfirmView').style.display = '';
}

function openManualModal(){
  document.getElementById('manualModal').classList.add('open');
  showManualListView();
  renderManualList();
}

document.getElementById('manualBtn').addEventListener('click', openManualModal);
document.getElementById('manualClose').addEventListener('click', closeManualModal);
document.getElementById('manualModal').addEventListener('click', (e) => {
  if(e.target.id === 'manualModal') closeManualModal(); // klik di luar panel = tutup
});
document.getElementById('kelasSelect').addEventListener('change', renderManualList);
document.getElementById('namaSearch').addEventListener('input', renderManualList);
document.getElementById('confirmBack').addEventListener('click', () => {
  showManualListView();
  renderManualList();
});

// klik nama di daftar -> tampilkan panel konfirmasi status
document.getElementById('manualList').addEventListener('click', (e) => {
  const row = e.target.closest('.manual-row');
  if(!row || !row.dataset.nisn) return;
  showManualConfirmView(row.dataset.nisn);
});

// klik salah satu tombol status di panel konfirmasi -> proses absen, lalu tutup modal
document.getElementById('manualConfirmView').addEventListener('click', async (e) => {
  const btn = e.target.closest('.mr-btn');
  if(!btn || btn.disabled || !selectedManualNisn) return;
  const status = btn.dataset.status;

  document.querySelectorAll('#manualConfirmView .mr-btn').forEach(b => b.disabled = true);
  await prosesAbsen(selectedManualNisn, status);

  selectedManualNisn = null;
  closeManualModal();
});

/* ---------- Init kamera ---------- */
const html5QrCode = new Html5Qrcode("reader", { verbose: false });
let currentFacing = "user"; // default kamera DEPAN

const scanConfig = {
  fps: 15,                                 // lebih tinggi dari sebelumnya (10) = baca lebih responsif
  qrbox: { width: 230, height: 230 },
  disableFlip: false,
  experimentalFeatures: { useBarCodeDetectorIfSupported: true } // pakai decoder native HP kalau tersedia, jauh lebih cepat
};

async function startScanner(facing){
  try{
    await html5QrCode.start(
      { facingMode: facing },
      scanConfig,
      onScanSuccess,
      () => {} // scan gagal per-frame, diamkan
    );
  }catch(err){
    document.getElementById('scanHint').textContent =
      "Tidak bisa mengakses kamera. Izinkan akses kamera di browser.";
    console.error(err);
  }
}

async function toggleCamera(){
  const btn = document.getElementById('camToggleBtn');
  btn.disabled = true;
  currentFacing = currentFacing === "user" ? "environment" : "user";
  try{
    await html5QrCode.stop();
  }catch(err){ /* kamera mungkin belum jalan, abaikan */ }
  await startScanner(currentFacing);
  btn.textContent = currentFacing === "user" ? "🔄 Kamera Depan" : "🔄 Kamera Belakang";
  btn.disabled = false;
}
document.getElementById('camToggleBtn').addEventListener('click', toggleCamera);

startScanner(currentFacing);
</script>
